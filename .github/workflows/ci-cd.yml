name: CI/CD

# Cuándo se ejecuta el pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña "Actions"

jobs:
  # ---------- CI: compilar y probar (en cada push y PR) ----------
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar dependencias
        run: dotnet restore

      - name: Compilar
        run: dotnet build --configuration Release --no-restore

      - name: Ejecutar tests
        run: dotnet test --configuration Release --no-build --verbosity normal

  # ---------- CD: publicar la app (solo en main, si CI pasó) ----------
  publish:
    needs: build-and-test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publicar la app
        run: dotnet publish src/CalculadoraApp --configuration Release --output ./publish

      - name: Probar el ejecutable publicado
        run: dotnet ./publish/CalculadoraApp.dll

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: calculadora-app
          path: ./publish
